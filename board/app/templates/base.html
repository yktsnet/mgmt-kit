<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}board{% endblock %}</title>
<link rel="stylesheet" href="/static/board.css">
</head>
<body>
<header class="bar">
  <span class="name">board</span>
  <nav>
    <span class="off" title="準備中">評価</span>
    <span class="off" title="準備中">育成</span>
    <span class="off" title="準備中">採用</span>
    <a href="/settings" class="{{ 'on' if page == 'settings' }}">設定</a>
  </nav>
  <span class="meta">{{ source }}から {{ synced }} に読み込み</span>
</header>
<main>
{% if errors %}
<div class="errors">
  <b>読めなかったファイルが {{ errors|length }} 件あります。</b>直して保存すると、次に開いたときに読み直します。
  <ul>{% for e in errors %}<li><code>{{ e.path }}</code> — {{ e.error }}</li>{% endfor %}</ul>
</div>
{% endif %}
{% block main %}{% endblock %}
</main>
</body>
</html>
